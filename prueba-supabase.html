
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>Prueba de conexión - Curso virtual</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f2f5fa;
    color: #203047;
    margin: 0;
    padding: 25px;
  }
  main { max-width: 700px; margin: auto; }
  section {
    background: white;
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
  }
  input, textarea, button {
    box-sizing: border-box;
    display: block;
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    font-size: 16px;
  }
  button {
    background: #17365d;
    color: white;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }
  textarea { min-height: 130px; }
  article {
    border-top: 1px solid #ddd;
    padding: 12px 0;
    white-space: pre-wrap;
  }
  [hidden] { display: none !important; }
</style>
</head>

<body>
<main>
<h1>Mi curso virtual</h1>
<p>Prueba de integración con Supabase</p>

<section id="seccionAcceso">
  <h2>Registro de estudiantes</h2>

  <input id="correo" type="email"
         placeholder="Correo electrónico">

  <input id="clave" type="password"
         placeholder="Contraseña">

  <button id="registrar">
    Crear cuenta
  </button>

  <button id="ingresar">
    Iniciar sesión
  </button>
</section>

<section id="seccionCurso" hidden>
  <h2>Bienvenido al curso</h2>
  <p id="usuario"></p>

  <button id="salir">
    Cerrar sesión
  </button>

  <h3>Unidad 1 - Actividad práctica</h3>

  <p>
    Escribe una respuesta de prueba para
    comprobar que Supabase guarda tus datos.
  </p>

  <textarea id="respuesta"
            placeholder="Escribe tu respuesta">
  </textarea>

  <button id="enviar">
    Guardar actividad
  </button>

  <h3>Mis actividades entregadas</h3>
  <div id="historial"></div>
</section>

<p id="mensaje" role="status"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseUrl =
  "https://myprogsezukselmteefb.supabase.co";

const supabaseKey =
  "sb_publishable_Z-mllci2Z9SlRdNXPYhu_w_y42oqIcx";

const db = window.supabase.createClient(
  supabaseUrl, supabaseKey
);

const el = id => document.getElementById(id);

function mensaje(texto) {
  el("mensaje").textContent = texto;
}

async function actualizarVista() {
  const { data, error } = await db.auth.getUser();
  const usuario = error ? null : data.user;

  el("seccionAcceso").hidden = !!usuario;
  el("seccionCurso").hidden = !usuario;

  if (usuario) {
    el("usuario").textContent = usuario.email;
    await cargarActividades();
  }
}

el("registrar").onclick = async () => {
  const { data, error } = await db.auth.signUp({
    email: el("correo").value.trim(),
    password: el("clave").value
  });

  if (error) {
    mensaje(error.message);
    return;
  }

  mensaje(data.session
    ? "Registro realizado correctamente."
    : "Revisa tu correo para confirmar la cuenta.");

  await actualizarVista();
};

el("ingresar").onclick = async () => {
  const { error } = await db.auth.signInWithPassword({
    email: el("correo").value.trim(),
    password: el("clave").value
  });

  if (error) {
    mensaje(error.message);
    return;
  }

  mensaje("Has iniciado sesión.");
  await actualizarVista();
};

el("enviar").onclick = async () => {
  const { data: { user }, error: authError } =
    await db.auth.getUser();

  if (authError || !user) {
    mensaje("Primero debes iniciar sesión.");
    return;
  }

  const respuesta = el("respuesta").value.trim();

  if (!respuesta) {
    mensaje("Escribe una respuesta.");
    return;
  }

  const { error } = await db
    .from("respuestas_curso")
    .insert({
      estudiante_id: user.id,
      unidad: "Unidad 1",
      actividad: "Actividad de prueba",
      respuesta: respuesta
    });

  if (error) {
    mensaje("No se pudo guardar: " + error.message);
    return;
  }

  el("respuesta").value = "";
  mensaje("Actividad guardada correctamente.");
  await cargarActividades();
};

async function cargarActividades() {
  const { data, error } = await db
    .from("respuestas_curso")
    .select("unidad, actividad, respuesta, fecha")
    .order("fecha", { ascending: false });

  if (error) {
    mensaje("Error al consultar: " + error.message);
    return;
  }

  const historial = el("historial");
  historial.replaceChildren();

  for (const item of data) {
    const articulo = document.createElement("article");
    const titulo = document.createElement("strong");
    const texto = document.createElement("p");

    titulo.textContent =
      item.unidad + " - " + item.actividad;
    texto.textContent = item.respuesta;

    articulo.append(titulo, texto);
    historial.append(articulo);
  }
}

el("salir").onclick = async () => {
  const { error } = await db.auth.signOut();

  if (error) {
    mensaje(error.message);
    return;
  }

  mensaje("Sesión cerrada.");
  await actualizarVista();
};

db.auth.onAuthStateChange(() => {
  setTimeout(actualizarVista, 0);
});

actualizarVista();
</script>
</body>
</html>
